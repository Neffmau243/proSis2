name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    # The integration suite migrates and queries a real schema: without a
    # database it only skips itself, so the ORM, the SQL and the migrations
    # would go unverified.  The service below is disposable and its name
    # contains `test`, which is the guard `tests/integration/conftest.py`
    # enforces before touching anything.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: ipress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:ci-root-password@127.0.0.1:3306/ipress_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      # The legacy migration files are intentionally generated and are not
      # style-reformatted.  Keep a strict undefined/unused-name gate here;
      # formatting can be adopted separately without obscuring runtime bugs.
      - run: python -m ruff check app tests migrations --select F
      # `pytest` runs with the coverage gate configured in pyproject.toml, so a
      # drop below the accepted floor fails the build instead of only warning.
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      # Unit, component and contract tests with their coverage thresholds.
      - run: npm run test:coverage
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fresh volumes and synthetic credentials; the test verifies restart too.
      - run: python tests/e2e/verify_docker.py --output output/docker-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-smoke
          path: output/docker-ci/
